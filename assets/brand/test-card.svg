<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="TV test card">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9a9a9a" stroke-width="1.2"/>
    </pattern>
    <pattern id="checker" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#fff"/>
      <rect x="20" y="20" width="20" height="20" fill="#fff"/>
      <rect x="20" width="20" height="20" fill="#111"/>
      <rect y="20" width="20" height="20" fill="#111"/>
    </pattern>
    <pattern id="freq" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="4" fill="#111"/>
      <rect x="2" width="2" height="4" fill="#eee"/>
    </pattern>
    <pattern id="freqFine" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="1" height="2" fill="#111"/>
      <rect x="1" width="1" height="2" fill="#f5f5f5"/>
    </pattern>
    <clipPath id="circleClip">
      <circle cx="400" cy="300" r="210"/>
    </clipPath>
  </defs>

  <!-- Background grid -->
  <rect width="800" height="600" fill="#5a5a5a"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Checkered border -->
  <rect width="800" height="600" fill="none" stroke="url(#checker)" stroke-width="36"/>

  <!-- Corner markers -->
  <g fill="#fff" stroke="#111" stroke-width="2">
    <circle cx="70" cy="70" r="28"/>
    <circle cx="730" cy="70" r="28"/>
    <circle cx="70" cy="530" r="28"/>
    <circle cx="730" cy="530" r="28"/>
  </g>
  <g fill="#111">
    <rect x="58" y="58" width="12" height="12"/><rect x="70" y="70" width="12" height="12"/>
    <rect x="718" y="58" width="12" height="12"/><rect x="730" y="70" width="12" height="12"/>
    <rect x="58" y="518" width="12" height="12"/><rect x="70" y="530" width="12" height="12"/>
    <rect x="718" y="518" width="12" height="12"/><rect x="730" y="530" width="12" height="12"/>
  </g>

  <!-- Side vertical bars -->
  <rect x="56" y="150" width="36" height="150" fill="#3ecfb0"/>
  <rect x="56" y="300" width="36" height="150" fill="#a01858"/>
  <rect x="708" y="150" width="36" height="150" fill="#7ec8c0"/>
  <rect x="708" y="300" width="36" height="150" fill="#c06030"/>

  <!-- Outer circle ring -->
  <circle cx="400" cy="300" r="216" fill="none" stroke="#111" stroke-width="10"/>
  <circle cx="400" cy="300" r="210" fill="#d0d0d0" stroke="#222" stroke-width="2"/>

  <!-- Circle contents -->
  <g clip-path="url(#circleClip)">
    <!-- Top black blocks -->
    <rect x="310" y="95" width="180" height="36" fill="#111"/>
    <rect x="200" y="140" width="90" height="42" fill="#111"/>
    <rect x="510" y="140" width="90" height="42" fill="#111"/>

    <!-- B/W castellations -->
    <g>
      <rect x="220" y="188" width="30" height="28" fill="#111"/>
      <rect x="250" y="188" width="30" height="28" fill="#fff"/>
      <rect x="280" y="188" width="30" height="28" fill="#111"/>
      <rect x="310" y="188" width="30" height="28" fill="#fff"/>
      <rect x="340" y="188" width="30" height="28" fill="#111"/>
      <rect x="370" y="188" width="30" height="28" fill="#fff"/>
      <rect x="400" y="188" width="30" height="28" fill="#111"/>
      <rect x="430" y="188" width="30" height="28" fill="#fff"/>
      <rect x="460" y="188" width="30" height="28" fill="#111"/>
      <rect x="490" y="188" width="30" height="28" fill="#fff"/>
      <rect x="520" y="188" width="30" height="28" fill="#111"/>
      <rect x="550" y="188" width="30" height="28" fill="#fff"/>
    </g>

    <!-- Color bars: Y C G M R B -->
    <rect x="220" y="216" width="60" height="70" fill="#c8c800"/>
    <rect x="280" y="216" width="60" height="70" fill="#00c8c8"/>
    <rect x="340" y="216" width="60" height="70" fill="#00c800"/>
    <rect x="400" y="216" width="60" height="70" fill="#c800c8"/>
    <rect x="460" y="216" width="60" height="70" fill="#c80000"/>
    <rect x="520" y="216" width="60" height="70" fill="#0000c8"/>

    <!-- Center crosshair bar -->
    <rect x="190" y="286" width="420" height="28" fill="#111"/>
    <rect x="392" y="250" width="16" height="100" fill="#fff"/>

    <!-- Resolution / frequency wedges -->
    <rect x="230" y="314" width="110" height="70" fill="url(#freq)"/>
    <rect x="340" y="314" width="120" height="70" fill="url(#freqFine)"/>
    <rect x="460" y="314" width="110" height="70" fill="url(#freq)"/>

    <!-- Grayscale ramp -->
    <rect x="230" y="384" width="48" height="28" fill="#000"/>
    <rect x="278" y="384" width="48" height="28" fill="#2a2a2a"/>
    <rect x="326" y="384" width="48" height="28" fill="#555"/>
    <rect x="374" y="384" width="48" height="28" fill="#808080"/>
    <rect x="422" y="384" width="48" height="28" fill="#aaa"/>
    <rect x="470" y="384" width="48" height="28" fill="#d0d0d0"/>
    <rect x="518" y="384" width="52" height="28" fill="#fff"/>

    <!-- Yellow lower field + center red bar -->
    <path d="M190 412 H610 V510 A210 210 0 0 1 190 510 Z" fill="#e0c010"/>
    <rect x="190" y="412" width="420" height="100" fill="#e0c010"/>
    <rect x="388" y="412" width="24" height="98" fill="#c00000"/>
  </g>

  <!-- Circle outline on top -->
  <circle cx="400" cy="300" r="210" fill="none" stroke="#111" stroke-width="3"/>

  <!-- Caption in top ID block -->
  <text x="400" y="120" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="13" font-weight="700" letter-spacing="2.5" fill="#fff">PLEASE STAND BY</text>
</svg>
