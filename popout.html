<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>magicTV</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: system-ui, sans-serif;
        }
        #surface {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        #status {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9a9a9a;
            font-size: 0.85rem;
            pointer-events: none;
        }
        #status.is-hidden { display: none; }
    </style>
</head>
<body>
    <div id="surface">
        <div id="status">Loading…</div>
        <video id="video" playsinline autoplay></video>
    </div>
    <script type="module" src="./js/popoutPlayer.js"></script>
</body>
</html>
